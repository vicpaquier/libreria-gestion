@let isHandset = this.isHandset();

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [attr.role]="isHandset ? 'dialog' : 'navigation'"
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="isHandset === false"
  >
    <mat-toolbar class="sidenav-title">
      <mat-icon>auto_stories</mat-icon>
      Librería
    </mat-toolbar>
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive
        #dashboardLink="routerLinkActive"
        [activated]="dashboardLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a
        mat-list-item
        routerLink="/libros"
        routerLinkActive
        #booksLink="routerLinkActive"
        [activated]="booksLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Libros</span>
      </a>
      <a
        mat-list-item
        routerLink="/autores"
        routerLinkActive
        #authorsLink="routerLinkActive"
        [activated]="authorsLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>Autores</span>
      </a>
      <a
        mat-list-item
        routerLink="/categorias"
        routerLinkActive
        #categoriesLink="routerLinkActive"
        [activated]="categoriesLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categorías</span>
      </a>
      <a
        mat-list-item
        routerLink="/usuarios"
        routerLinkActive
        #customersLink="routerLinkActive"
        [activated]="customersLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Usuarios</span>
      </a>
      <a
        mat-list-item
        routerLink="/prestamos"
        routerLinkActive
        #loansLink="routerLinkActive"
        [activated]="loansLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>swap_horiz</mat-icon>
        <span matListItemTitle>Préstamos</span>
      </a>
      <a
        mat-list-item
        routerLink="/editoriales"
        routerLinkActive
        #editorialsLink="routerLinkActive"
        [activated]="editorialsLink.isActive"
        (click)="isHandset && drawer.close()"
      >
        <mat-icon matListItemIcon>business</mat-icon>
        <span matListItemTitle>Editoriales</span>
      </a>
      <a
        mat-list-item
        routerLink="/reservas"
        routerLinkActive
        #reservationsLink="routerLinkActive"
        [activated]="reservationsLink.isActive"
        (click)="isHandset && drawer.close()"
        ><mat-icon matListItemIcon>bookmark</mat-icon><span matListItemTitle>Reservas</span></a
      >
      <a
        mat-list-item
        routerLink="/multas"
        routerLinkActive
        #finesLink="routerLinkActive"
        [activated]="finesLink.isActive"
        (click)="isHandset && drawer.close()"
        ><mat-icon matListItemIcon>payments</mat-icon><span matListItemTitle>Multas</span></a
      >
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar>
      @if (isHandset) {
        <button
          type="button"
          aria-label="Abrir menú"
          matIconButton
          matTooltip="Abrir menú"
          (click)="drawer.toggle()"
        >
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-brand">Librería Gestión</span>
      <span class="toolbar-spacer"></span>
      <button matIconButton type="button" aria-label="Notificaciones" matTooltip="Notificaciones">
        <mat-icon>notifications_none</mat-icon>
      </button>
    </mat-toolbar>
    <ng-content />
  </mat-sidenav-content>
</mat-sidenav-container>
