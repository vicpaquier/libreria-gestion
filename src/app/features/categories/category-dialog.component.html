<h2 mat-dialog-title>{{ isEditing ? 'Modificar categoría' : 'Nueva categoría' }}</h2>
<mat-dialog-content
  ><form class="entity-form" [formGroup]="form">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label><input matInput formControlName="nombre" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Descripción</mat-label
      ><textarea matInput formControlName="descripcion"></textarea>
    </mat-form-field></form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button matButton mat-dialog-close>Cancelar</button
  ><button matButton="filled" (click)="submit()">Guardar</button></mat-dialog-actions
>
