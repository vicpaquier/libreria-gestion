<main class="page-content">
  <section class="page-heading">
    <h1>Categorías</h1>
    <button matButton="filled" (click)="create()"><mat-icon>add</mat-icon>Nueva categoría</button>
  </section>
  <mat-card class="table-card" appearance="outlined"
    ><mat-card-content>
      @if (store.loading()) {
        <p role="status">Cargando categorías...</p>
      }
      @if (store.error()) {
        <p role="alert">{{ store.error() }}</p>
      }
      <table mat-table [dataSource]="store.categories()">
        <ng-container matColumnDef="nombre"
          ><th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let item">{{ item.nombre }}</td></ng-container
        ><ng-container matColumnDef="descripcion"
          ><th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let item">
            {{ item.descripcion || 'Sin descripción' }}
          </td></ng-container
        ><ng-container matColumnDef="acciones"
          ><th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let item">
            <button matButton (click)="edit(item)">Editar</button
            ><button matButton (click)="remove(item)">Eliminar</button>
          </td></ng-container
        >
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr></table></mat-card-content
  ></mat-card>
</main>
