<h2 mat-dialog-title>{{ isEditing ? 'Modificar usuario' : 'Nuevo usuario' }}</h2>
<mat-dialog-content
  ><form class="customer-form" [formGroup]="form">
    <div class="form-row">
      <mat-form-field appearance="outline"
        ><mat-label>Nombre</mat-label><input matInput formControlName="nombre" /></mat-form-field
      ><mat-form-field appearance="outline"
        ><mat-label>Apellido</mat-label><input matInput formControlName="apellido"
      /></mat-form-field>
    </div>
    <mat-form-field appearance="outline"
      ><mat-label>Cédula</mat-label
      ><input matInput formControlName="cedula" [readonly]="isEditing" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Email</mat-label
      ><input matInput type="email" formControlName="email" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Teléfono</mat-label><input matInput formControlName="telefono" /></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Dirección</mat-label><textarea matInput formControlName="direccion"></textarea>
    </mat-form-field></form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button matButton mat-dialog-close>Cancelar</button
  ><button matButton="filled" (click)="submit()" [disabled]="submitted()">
    Guardar
  </button></mat-dialog-actions
>
