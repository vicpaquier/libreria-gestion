<main class="page-content">
  <section class="page-heading" aria-labelledby="customers-title">
    <h1 id="customers-title">Clientes</h1>
    <button matButton="filled" type="button" (click)="openCreateDialog()">
      <mat-icon>person_add</mat-icon>
      Nuevo cliente
    </button>
  </section>

  <mat-card class="table-card" appearance="outlined" aria-labelledby="customers-catalog-title">
    <mat-card-header>
      <mat-card-title id="customers-catalog-title">Directorio de clientes</mat-card-title>
      <mat-card-subtitle>{{ filteredCustomers().length }} resultados</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="table-toolbar">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Buscar cliente</mat-label>
          <mat-icon matIconPrefix>search</mat-icon>
          <input
            matInput
            type="search"
            placeholder="Nombre, correo o teléfono..."
            (input)="onSearch($event)"
          />
        </mat-form-field>
      </div>

      <mat-divider />

      <div class="table-wrapper">
        <table
          mat-table
          [dataSource]="pagedCustomers()"
          matSort
          [matSortActive]="sort().active"
          [matSortDirection]="sort().direction"
          (matSortChange)="onSort($event)"
          aria-label="Directorio de clientes"
        >
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let customer" class="primary-cell">
              {{ customer.name }}
            </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
            <td mat-cell *matCellDef="let customer">
              <a [href]="'mailto:' + customer.email">{{ customer.email }}</a>
            </td>
          </ng-container>

          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Teléfono</th>
            <td mat-cell *matCellDef="let customer">{{ customer.phone }}</td>
          </ng-container>

          <ng-container matColumnDef="address">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Dirección</th>
            <td mat-cell *matCellDef="let customer">
              <div class="secondary-cell">{{ customer.address }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>
              <span class="visually-hidden">Acciones</span>
            </th>
            <td mat-cell *matCellDef="let customer">
              <button
                matIconButton
                [matMenuTriggerFor]="actionsMenu"
                [matMenuTriggerData]="{ customer }"
                [attr.aria-label]="'Acciones para ' + customer.name"
                matTooltip="Acciones"
              >
                <mat-icon>more_vert</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="empty-cell" [attr.colspan]="displayedColumns.length">
              No hay clientes que coincidan con la búsqueda.
            </td>
          </tr>
        </table>
      </div>
    </mat-card-content>

    <mat-divider />
    <mat-card-footer>
      <mat-paginator
        [length]="filteredCustomers().length"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[8, 16, 24]"
        showFirstLastButtons
        (page)="onPageChange($event)"
        aria-label="Paginación de clientes"
      />
    </mat-card-footer>
  </mat-card>
</main>

<mat-menu #actionsMenu="matMenu">
  <ng-template matMenuContent let-customer="customer">
    <button mat-menu-item type="button" (click)="openEditDialog(customer)">
      <mat-icon>edit</mat-icon>
      <span>Modificar</span>
    </button>
    <button mat-menu-item type="button" (click)="confirmDelete(customer)">
      <mat-icon>delete</mat-icon>
      <span>Eliminar</span>
    </button>
  </ng-template>
</mat-menu>
