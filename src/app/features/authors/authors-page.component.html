<main class="page-content">
  <section class="page-heading">
    <h1>Autores</h1>
    <button matButton="filled" (click)="create()"><mat-icon>add</mat-icon>Nuevo autor</button>
  </section>
  <mat-card class="table-card" appearance="outlined"
    ><mat-card-content
      ><mat-form-field appearance="outline"
        ><mat-label>Buscar autor</mat-label><input matInput type="search" (input)="search($event)"
      /></mat-form-field>
      @if (store.loading()) {
        <p role="status">Cargando autores...</p>
      }
      @if (store.error()) {
        <p role="alert">{{ store.error() }}</p>
      }
      <table mat-table [dataSource]="store.authors()">
        <ng-container matColumnDef="nombre"
          ><th mat-header-cell *matHeaderCellDef>Autor</th>
          <td mat-cell *matCellDef="let a">{{ a.nombre }} {{ a.apellido }}</td></ng-container
        ><ng-container matColumnDef="nacionalidad"
          ><th mat-header-cell *matHeaderCellDef>Nacionalidad</th>
          <td mat-cell *matCellDef="let a">{{ a.nacionalidad || 'Sin indicar' }}</td></ng-container
        ><ng-container matColumnDef="acciones"
          ><th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let a">
            <button matButton (click)="edit(a)">Editar</button
            ><button matButton (click)="remove(a)">Eliminar</button>
          </td></ng-container
        >
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr></table></mat-card-content
  ></mat-card>
</main>
