<main class="page-content">
  <section class="page-heading" aria-labelledby="authors-title">
    <h1 id="authors-title">Autores</h1>
    <button matButton="filled" type="button" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>Nuevo autor
    </button>
  </section>

  <mat-card class="table-card" appearance="outlined" aria-labelledby="authors-catalog-title">
    <mat-card-header>
      <mat-card-title id="authors-catalog-title">Directorio de autores</mat-card-title>
      <mat-card-subtitle>{{ filteredAuthors().length }} resultados</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="table-toolbar">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Buscar autor</mat-label>
          <mat-icon matIconPrefix>search</mat-icon>
          <input
            matInput
            type="search"
            placeholder="Nombre o nacionalidad..."
            (input)="onSearch($event)"
          />
        </mat-form-field>
      </div>
      <mat-divider />
      <div class="table-wrapper">
        <table
          mat-table
          [dataSource]="pagedAuthors()"
          matSort
          [matSortActive]="sort().active"
          [matSortDirection]="sort().direction"
          (matSortChange)="onSort($event)"
          aria-label="Directorio de autores"
        >
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let author" class="primary-cell">{{ author.name }}</td>
          </ng-container>
          <ng-container matColumnDef="nationality">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nacionalidad</th>
            <td mat-cell *matCellDef="let author">{{ author.nationality }}</td>
          </ng-container>
          <ng-container matColumnDef="biography">
            <th mat-header-cell *matHeaderCellDef>Biografía</th>
            <td mat-cell *matCellDef="let author">
              <div class="secondary-cell">{{ author.biography || 'Sin biografía' }}</div>
            </td>
          </ng-container>
          <ng-container matColumnDef="books">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Libros</th>
            <td mat-cell *matCellDef="let author">
              <mat-chip-set aria-label="Libros asociados"
                ><mat-chip class="count-chip" disableRipple>{{
                  bookCount(author.id)
                }}</mat-chip></mat-chip-set
              >
            </td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef><span class="visually-hidden">Acciones</span></th>
            <td mat-cell *matCellDef="let author">
              <button
                matIconButton
                [matMenuTriggerFor]="actionsMenu"
                [matMenuTriggerData]="{ author }"
                [attr.aria-label]="'Acciones para ' + author.name"
                matTooltip="Acciones"
              >
                <mat-icon>more_vert</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="empty-cell" [attr.colspan]="displayedColumns.length">
              No hay autores que coincidan con la búsqueda.
            </td>
          </tr>
        </table>
      </div>
    </mat-card-content>
    <mat-divider />
    <mat-card-footer
      ><mat-paginator
        [length]="filteredAuthors().length"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[8, 16, 24]"
        showFirstLastButtons
        (page)="onPageChange($event)"
        aria-label="Paginación de autores"
    /></mat-card-footer>
  </mat-card>
</main>

<mat-menu #actionsMenu="matMenu">
  <ng-template matMenuContent let-author="author">
    <button mat-menu-item type="button" (click)="openEditDialog(author)">
      <mat-icon>edit</mat-icon><span>Modificar</span>
    </button>
    <button mat-menu-item type="button" (click)="confirmDelete(author)">
      <mat-icon>delete</mat-icon><span>Eliminar</span>
    </button>
  </ng-template>
</mat-menu>
