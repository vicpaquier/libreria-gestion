<h2 mat-dialog-title>{{ isEditing ? 'Modificar autor' : 'Nuevo autor' }}</h2>
<mat-dialog-content
  ><form class="entity-form" [formGroup]="form">
    <mat-form-field appearance="outline"
      ><mat-label>Nombre</mat-label><input matInput formControlName="nombre" />
      @if (form.controls.nombre.invalid) {
        <mat-error>Obligatorio</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Apellido</mat-label><input matInput formControlName="apellido" />
      @if (form.controls.apellido.invalid) {
        <mat-error>Obligatorio</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Nacionalidad</mat-label><input matInput formControlName="nacionalidad"
    /></mat-form-field></form
></mat-dialog-content>
<mat-dialog-actions align="end"
  ><button matButton mat-dialog-close>Cancelar</button
  ><button matButton="filled" (click)="submit()">Guardar</button></mat-dialog-actions
>
