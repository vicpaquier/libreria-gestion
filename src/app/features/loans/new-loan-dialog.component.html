<h2 mat-dialog-title>Nuevo préstamo</h2>
<mat-dialog-content
  ><form class="loan-form" [formGroup]="form">
    <mat-form-field appearance="outline"
      ><mat-label>Usuario activo</mat-label
      ><mat-select formControlName="usuarioId">
        @for (u of users.customers(); track u.id) {
          <mat-option [value]="u.id">{{ u.nombre }} {{ u.apellido }} · {{ u.cedula }}</mat-option>
        }
      </mat-select></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Libros disponibles</mat-label
      ><mat-select formControlName="librosIds" multiple>
        @for (b of books.books(); track b.id) {
          <mat-option [value]="b.id" [disabled]="b.cantidadDisponible === 0"
            >{{ b.titulo }} ({{ b.cantidadDisponible }})</mat-option
          >
        }
      </mat-select></mat-form-field
    ><mat-form-field appearance="outline"
      ><mat-label>Fecha de vencimiento</mat-label
      ><input matInput type="date" formControlName="fechaVencimiento"
    /></mat-form-field></form></mat-dialog-content
><mat-dialog-actions align="end"
  ><button matButton mat-dialog-close>Cancelar</button
  ><button matButton="filled" (click)="submit()" [disabled]="submitted()">
    Crear préstamo
  </button></mat-dialog-actions
>
